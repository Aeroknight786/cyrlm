name: Harness e2e
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  harness:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        harness: [claude-code, codex, opencode, aider, qwen-code, cline, continue]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - name: Test harness fixtures
        run: |
          go test ./tools/harness-e2e
          python3 -m unittest discover -s tools/harness-e2e -p 'test_*.py'
      - name: Run harnesses
        shell: bash
        run: |
          go run ./tools/harness-e2e -only '${{ matrix.harness }}' -output harness-e2e-logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: harness-e2e-${{ matrix.os }}-${{ matrix.harness }}
          path: harness-e2e-logs
